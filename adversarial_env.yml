name: adv
channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip
  # ART 1.17.1 still imports pkg_resources, removed by recent setuptools.
  - setuptools=69.5.1
  - pytorch=2.3.1
  - torchvision=0.18.1
  - pytorch-cuda=11.8
  - cuda-version=11.8
  - numpy<2
  - matplotlib
  - scikit-learn
  - adversarial-robustness-toolbox=1.17.1
  # Required by ART's AutoAttack implementation for parallel execution.
  - multiprocess
  - opencv
  - pillow
  - tensorboardx
  - tqdm
  - multiprocess
  - pip:
      - einops==0.8.1
      - grad-cam==1.5.5
      - medmnist==3.0.2
      - timm==1.0.15
